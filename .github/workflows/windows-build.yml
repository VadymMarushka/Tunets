# Builds the Windows desktop app on GitHub's servers.
# Download the result from the repo's Actions tab -> latest run -> Artifacts.
name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: fishing_diary-windows
          path: build/windows/x64/runner/Release/
