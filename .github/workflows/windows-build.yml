# Builds the Windows desktop app on GitHub's servers.
# Download the result from the repo's Actions tab -> latest run -> Artifacts.
name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build windows --release

      # Ship the MSVC runtime next to the exe so it runs on PCs without vc_redist.
      - name: Bundle MSVC runtime DLLs
        shell: pwsh
        run: |
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" build/windows/x64/runner/Release/
          }

      - uses: actions/upload-artifact@v4
        with:
          name: fishing_diary-windows
          path: build/windows/x64/runner/Release/
